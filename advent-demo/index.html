<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ノーリーのアドベントカレンダー</title>
<meta name="description" content="12/1〜25、毎日ひらくとノーリーのクリスマスの物語が少しずつ進みます。">
<style>
:root{--bg:#0f1a33;--bg2:#1b2a4d;--gold:#e9c46a;--gold2:#f6e3a1;--ink:#fdf8ee;--sub:#b9c3dc;--red:#d8423a;--card:#fffaf0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(120% 70% at 50% 0%,#24396a 0%,var(--bg) 60%)}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:28px 16px 48px}
header{text-align:center;margin-bottom:18px}
header .en{font-size:11px;letter-spacing:.3em;color:var(--gold)}
header h1{font-size:22px;font-weight:800;margin:6px 0 4px;line-height:1.4}
header p{font-size:13px;color:var(--sub)}
.count{display:flex;justify-content:center;gap:8px;align-items:center;margin:14px 0 18px;font-size:13px;color:var(--sub)}
.count b{font-size:22px;color:var(--gold2)}
.bar{height:6px;border-radius:3px;background:#2a3b63;overflow:hidden;margin:0 auto 22px;max-width:320px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));width:0;transition:width .6s}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.door{position:relative;aspect-ratio:2/3;border-radius:10px;border:0;cursor:pointer;background:linear-gradient(160deg,#2c4377,#1b2a4d);color:var(--ink);font:inherit;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.25) inset,0 4px 14px rgba(0,0,0,.25)}
.door .n{position:absolute;left:7px;top:5px;font-size:18px;font-weight:800}
.door.star{background:linear-gradient(160deg,#c8962f,#8a5c13)}
.door.star::after{content:"★";position:absolute;right:6px;bottom:4px;font-size:13px;color:var(--gold2)}
.door.finale{background:linear-gradient(160deg,#b8322b,#6e1712)}
.door.locked{opacity:.45;cursor:default}
.door.locked .n::after{content:" 🔒";font-size:11px}
.door.today{outline:2px solid var(--gold2);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 18px rgba(246,227,161,.7)}}
.door img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.door.open .n{background:rgba(15,26,51,.6);border-radius:6px;padding:0 5px}
.note{margin-top:22px;font-size:12px;color:var(--sub);line-height:1.8;text-align:center}
.modal{position:fixed;inset:0;z-index:10;background:rgba(6,10,22,.86);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.sheet{width:min(92vw,420px);text-align:center}
.sheet .ch{font-size:12px;color:var(--gold);letter-spacing:.1em}
.sheet h2{font-size:18px;margin:4px 0 12px}
.card{position:relative;width:100%;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:var(--card);box-shadow:0 10px 40px rgba(0,0,0,.5)}
.stagebox{perspective:1000px}
.card{will-change:transform}
.card canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.lens{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.5;background:repeating-linear-gradient(90deg,#ffffff2e 0 1px,#0000 1px 3px,#00000045 3px 4px)}
.sheen{position:absolute;inset:-25%;pointer-events:none;mix-blend-mode:screen;background:linear-gradient(105deg,#0000 36%,#f6e3a130 44%,#ffffff50 50%,#9fd8ff30 56%,#0000 64%);transform:translateX(var(--sx,0%))}
.edge{position:absolute;inset:0;border-radius:14px;pointer-events:none;box-shadow:0 0 0 5px #07051266 inset,0 0 0 6px #ffffff20 inset}
.card .lay{position:absolute;inset:0;transition:opacity .25s}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:linear-gradient(160deg,#fdf3df,#f3e1bf);color:#5a4630;padding:20px}
.ph .d{font-size:56px;font-weight:800;color:var(--red)}
.ph .s{font-size:15px;font-weight:700}
.ph .m{font-size:11px;opacity:.7}
.hint{margin-top:12px;font-size:12px;color:var(--sub)}
.pg{position:absolute;left:10px;bottom:10px;background:rgba(15,26,51,.7);color:#fff;font-size:12px;border-radius:999px;padding:3px 10px}
.book{margin-top:12px}
#dots{display:flex;flex-wrap:nowrap;gap:4px;justify-content:center;margin:0 auto}
#dots span{width:8px;height:8px;border-radius:50%;background:#3a4a70;transition:transform .2s,background .2s}
#dots span.on{background:#f6e3a1;box-shadow:0 0 6px rgba(246,227,161,.8)}
#dots span.now{transform:scale(1.7);background:#fff}
.bk{display:flex;justify-content:center;gap:12px;align-items:baseline;margin-top:8px;font-size:13px;color:var(--sub)}
.bk b{font-size:18px;color:var(--gold2)}
#bkMsg{display:block;min-height:22px;margin-top:6px;font-size:14px;font-weight:800;color:var(--gold2)}
#bkMsg.done{font-size:16px;text-shadow:0 0 10px rgba(246,227,161,.9)}
.btns{display:flex;gap:10px;justify-content:center;margin-top:14px}
.btn{border:0;border-radius:999px;padding:10px 20px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;background:var(--gold);color:#2b1d05}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid #4b5d88}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<main>
  <header>
    <div class="en">NOLLY ADVENT CALENDAR</div>
    <h1 id="ttl"></h1>
    <p id="story"></p>
  </header>
  <div class="count">あつめたカード <b id="got">0</b> / 25</div>
  <div class="bar"><i id="barI"></i></div>
  <div class="grid" id="grid"></div>
  <p class="note" id="note">毎日1枚、とびらをひらいてカードをあつめよう。<br>★の日（4の倍数の日）は、スマホを傾けると絵が変わる当たりカード！</p>
</main>

<div class="modal" id="modal">
  <div class="sheet">
    <div class="ch" id="mCh"></div>
    <h2 id="mT"></h2>
    <div class="stagebox"><div class="card" id="card"></div></div>
    <div class="book" id="book" style="display:none"><div id="dots"></div><div class="bk"><span>あつめたカード <b id="bkCount"></b></span></div><span id="bkMsg"></span></div>
    <div class="hint" id="hint"></div>
    <div class="btns"><a class="btn" id="movie" style="display:none" target="_blank" rel="noopener">特典動画を見る</a><button class="btn ghost" id="close">とじる</button></div>
  </div>
</div>

<script src="data.js"></script>
<script>
(function(){
  const A = window.ADVENT, Q = new URLSearchParams(location.search);
  const PREVIEW = Q.get("preview") === "1";
  const KEY = "nolly-advent-" + A.year;
  const store = {
    get(){ try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch(e){ return []; } },
    set(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} }
  };
  // 日本時間の今日
  function todayJST(){
    if (Q.get("date")) { const p = Q.get("date").split("-").map(Number); return {y:p[0], m:p[1], d:p[2]}; }
    const s = new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",year:"numeric",month:"numeric",day:"numeric"}).formatToParts(new Date());
    const g = t => +s.find(x=>x.type===t).value; return {y:g("year"), m:g("month"), d:g("day")};
  }
  const T = todayJST();
  function openable(d){
    if (PREVIEW) return true;
    if (T.y > A.year || (T.y === A.year && T.m > A.month)) return true;
    return T.y === A.year && T.m === A.month && d <= T.d;
  }
  const isToday = d => T.y === A.year && T.m === A.month && T.d === d;
  document.getElementById("ttl").textContent = A.title;
  document.getElementById("story").textContent = "物語「" + A.story + "」";
  if (!openable(1)) document.getElementById("note").innerHTML = "12月1日からスタート！<br>毎日1枚、とびらをひらいてカードをあつめよう。";

  let got = store.get();
  const grid = document.getElementById("grid");
  function src(d, s){ return "images/day" + String(d).padStart(2,"0") + (s||"") + ".jpg"; }
  function imgOrPh(d, s, info){
    const w = document.createElement("div"); w.style.cssText = "width:100%;height:100%";
    const im = new Image(); im.src = src(d, s); im.alt = info.t;
    im.onerror = () => { w.innerHTML = '<div class="ph"><div class="d">' + d + '</div><div class="s">' + info.t + (s==="_b"?"（後）":s==="_a"?"（前）":"") + '</div><div class="m">' + info.ch + '<br>（画像準備中）</div></div>'; };
    w.appendChild(im); return w;
  }
  function render(){
    grid.innerHTML = "";
    A.days.forEach(info => {
      const d = info.d, b = document.createElement("button");
      b.className = "door" + (info.lenti?" star":"") + (info.finale?" finale":"") + (openable(d)?"":" locked") + (isToday(d)?" today":"") + (got.includes(d)?" open":"");
      b.innerHTML = '<span class="n">' + d + '</span>';
      if (got.includes(d)) { const t = new Image(); t.src = src(d, info.lenti?"_b":""); t.onerror = () => t.remove(); b.prepend(t); }
      b.onclick = () => { if (openable(d)) open(info); };
      grid.appendChild(b);
    });
    document.getElementById("got").textContent = got.length;
    document.getElementById("barI").style.width = (got.length/25*100) + "%";
  }

  // ---- 傾き ----
  // 生の傾き → なめらかにする → 開いたときの角度を「まっすぐ」とみなす
  let raw = 0, smooth = 0, base = null, mode = null, layers = [];
  let sensed = false, mouseUsed = false;
  window.addEventListener("deviceorientation", e => { if (e.gamma != null) { sensed = true; raw = Math.max(-45, Math.min(45, e.gamma)); } });
  async function askPermission(){
    try { if (typeof DeviceOrientationEvent !== "undefined" && DeviceOrientationEvent.requestPermission) await DeviceOrientationEvent.requestPermission(); } catch(e){}
  }
  document.getElementById("card").addEventListener("mousemove", e => {  // パソコンではマウスの位置で確認できる
    mouseUsed = true; const r = e.currentTarget.getBoundingClientRect(); raw = ((e.clientX - r.left)/r.width - .5) * 60; if (base === null) base = 0;
  });
  const rel = () => smooth - (base || 0);   // まっすぐからの傾き（右が＋）

  // ---- レンチキュラー表示（以前のネオン版と同じ描き方：細い縦じまで絵を切り替える） ----
  let lenti = null;   // {cv, ctx, frames, n}
  function placeholder(d, label){
    const c = document.createElement("canvas"); c.width = 720; c.height = 1080; const g = c.getContext("2d");
    const gr = g.createLinearGradient(0,0,720,1080); gr.addColorStop(0,"#fdf3df"); gr.addColorStop(1,"#f3e1bf"); g.fillStyle = gr; g.fillRect(0,0,720,1080);
    g.textAlign = "center"; g.fillStyle = "#d8423a"; g.font = "800 150px sans-serif"; g.fillText(d, 360, 520);
    g.fillStyle = "#5a4630"; g.font = "700 40px sans-serif"; g.fillText(label, 360, 600); g.font = "28px sans-serif"; g.fillText("（画像準備中）", 360, 650);
    return c;
  }
  function setupLenti(card, list){   // list: [{d, s, t}]
    const cv = document.createElement("canvas"); cv.width = 720; cv.height = 1080; card.appendChild(cv);
    ["lens","sheen","edge"].forEach(k => { const e = document.createElement("div"); e.className = k; card.appendChild(e); });
    const frames = list.map(x => placeholder(x.d, x.t));
    lenti = { cv, ctx: cv.getContext("2d"), frames, n: frames.length, p: -1 };
    list.forEach((x, i) => { const im = new Image(); im.onload = () => { frames[i] = im; lenti.p = -1; }; im.src = src(x.d, x.s); });
  }
  function drawLenti(p){
    if (!lenti) return;
    if (Math.abs(p - lenti.p) < 0.002) return; lenti.p = p;
    const {ctx, frames, n} = lenti, W = 720, H = 1080, STRIP = 6;
    for (let x = 0; x < W; x += STRIP) {
      const q = Math.min(n-1, Math.max(0, p + ((x/W) - .5) * 0.3));   // 少しずつ横にずれて切り替わる
      const a = Math.floor(q), b = Math.min(n-1, a+1), f = q - a;
      const gh = Math.min(1, Math.max(0, (f - .38) / .24));               // 切り替わりの一瞬だけ前後が重なる
      const put = (img, al) => { const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
        ctx.globalAlpha = al; ctx.drawImage(img, x/W*iw, 0, STRIP/W*iw, ih, x, 0, STRIP, H); };
      put(frames[a], 1); if (gh > 0 && b !== a) put(frames[b], gh);
      ctx.globalAlpha = .1; ctx.fillStyle = "#000"; ctx.fillRect(x + STRIP - 1, 0, 1, H);
    }
    ctx.globalAlpha = 1;
  }

  // ---- 25日の絵本 ----
  // 持っている日のリスト（本番ではPULSEから受け取る。確認用に ?have=15 や ?have=1,2,5 で試せる）
  function ownedDays(){
    const h = Q.get("have");
    if (h) {
      if (h.includes(",")) return h.split(",").map(Number).filter(d => d>=1 && d<=24).sort((a,b)=>a-b);
      const n = Math.max(0, Math.min(24, +h)); const out = [];
      for (let d = 1; d <= 24; d++) if ((d * 7) % 24 < n || (n === 24)) out.push(d);
      return out;
    }
    return got.filter(d => d <= 24).sort((a,b)=>a-b);
  }
  let owned = [], pos = 0, last = 0, direct = false, lastT = 0;
  const dotsEl = document.getElementById("dots"), msgEl = document.getElementById("bkMsg");
  function buildBook(){
    dotsEl.innerHTML = "";
    for (let d = 1; d <= 24; d++) {                       // ① 24個の点
      const sp = document.createElement("span"); if (owned.includes(d)) sp.className = "on"; dotsEl.appendChild(sp);
    }
    document.getElementById("bkCount").textContent = owned.length + " / 24";   // ② 枚数
  }
  function drawBook(){
    const i = Math.floor(pos), f = pos - i;               // 前後の絵を重ねて入れ替える（レンチキュラー風）
    drawLenti(pos);
    const cur = Math.round(pos), day = owned[cur];        // ③ 今見ているページの点
    dotsEl.querySelectorAll("span").forEach((sp,k) => sp.classList.toggle("now", k + 1 === day));
    document.getElementById("pg").textContent = (cur === last ? "25日" : day + "日") + "　" + (cur + 1) + " / " + (last + 1);
    if (cur === last) {                                   // ④ 最後のページ
      if (owned.length === 24) { msgEl.textContent = "物語が完成しました！"; msgEl.className = "done"; }
      else { msgEl.textContent = "あと" + (24 - owned.length) + "枚で物語が完成"; msgEl.className = ""; }
    } else { msgEl.textContent = ""; msgEl.className = ""; }
  }
  function tick(t){
    smooth += (raw - smooth) * 0.2;                       // 手のふるえをならす
    if (base === null && raw !== 0) base = smooth;
    const cardEl = document.getElementById("card");
    if (mode === "lenti" || mode === "finale") {
      const g = Math.max(-25, Math.min(25, rel()));
      cardEl.style.transform = "rotateY(" + (g * 0.6) + "deg)";              // カードが少し回って見える
      const sh = cardEl.querySelector(".sheen"); if (sh) sh.style.setProperty("--sx", (g * 2.6) + "%");   // 光の反射が動く
    } else cardEl.style.transform = "";
    if (mode === "lenti") drawLenti(Math.min(1, Math.max(0, (rel() - 3) / 8)));
    if (mode === "finale") {
      const dt = Math.min(0.05, (t - (lastT || t)) / 1000), g = rel();
      if (direct) {                                       // 8枚以下：角度＝ページの位置
        pos = Math.max(0, Math.min(last, (g + 20) / 40 * last));   // ±20°で端から端まで
      } else {                                            // 9枚以上：傾けている間ページが進む
        const DEAD = 6, MAX = 25, SPEED = 3;              // 遊び6°、25°で最高速（1秒に3ページ）
        const a = Math.abs(g);
        if (a > DEAD) pos += Math.sign(g) * Math.min(1, (a - DEAD) / (MAX - DEAD)) * SPEED * dt;
        else pos += (Math.round(pos) - pos) * 0.15;       // まっすぐに戻すと近いページに落ち着く
        pos = Math.max(0, Math.min(last, pos));
      }
      drawBook();
    }
    lastT = t; requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function open(info){
    askPermission(); base = null; smooth = raw;
    const d = info.d;
    if (!got.includes(d)) { got.push(d); got.sort((a,b)=>a-b); store.set(got); }
    const card = document.getElementById("card"); card.innerHTML = ""; layers = [];
    document.getElementById("mCh").textContent = "12月" + d + "日 ・ " + info.ch;
    document.getElementById("mT").textContent = info.t;
    const mv = document.getElementById("movie"); mv.style.display = "none";
    document.getElementById("book").style.display = "none";
    const add = el => { const l = document.createElement("div"); l.className = "lay"; l.appendChild(el); card.appendChild(l); layers.push(l); return l; };
    if (info.lenti) {
      mode = "lenti"; lenti = null; setupLenti(card, [{d, s:"_a", t:info.t+"（前）"}, {d, s:"_b", t:info.t+"（後）"}]);
      document.getElementById("hint").textContent = "★当たり！ スマホを左右に傾けてみてね";
    } else if (info.finale) {
      mode = "finale";
      owned = ownedDays();
      lenti = null;
      setupLenti(card, owned.map(x => ({d:x, s: A.days[x-1].lenti ? "_b" : "", t: A.days[x-1].t})).concat([{d:25, s:"", t:info.t}]));
      last = owned.length; pos = 0; direct = owned.length <= 8;
      const pg = document.createElement("div"); pg.className = "pg"; pg.id = "pg"; card.appendChild(pg);
      document.getElementById("book").style.display = "";
      buildBook(); drawBook();
      document.getElementById("hint").textContent = owned.length === 24
        ? "全24枚がそろった！ スマホを右に傾けると物語が進み、左に傾けると戻るよ"
        : "あつめた" + owned.length + "枚で、あなただけの絵本ができたよ。右に傾けると進み、左に傾けると戻るよ";
      if (A.finaleMovieUrl && owned.length === 24) { mv.href = A.finaleMovieUrl; mv.style.display = ""; }
    } else {
      mode = "story"; lenti = null; add(imgOrPh(d,"",info));
      document.getElementById("hint").textContent = "物語のつづきは、また明日";
    }
    document.getElementById("modal").classList.add("on");
    render();
    if (mode === "lenti" || mode === "finale") setTimeout(() => {   // 傾きセンサーが使えないときの案内
      if (!sensed && !mouseUsed && document.getElementById("modal").classList.contains("on"))
        document.getElementById("hint").textContent = "傾きを感知できませんでした。スマホのブラウザで開き、「動きと方向へのアクセス」を許可してください。";
    }, 2500);
  }
  document.getElementById("close").onclick = () => { document.getElementById("modal").classList.remove("on"); mode = null; };
  document.getElementById("modal").onclick = e => { if (e.target.id === "modal") e.currentTarget.classList.remove("on"); };
  render();

  // 雪
  const c = document.getElementById("snow"), x = c.getContext("2d"); let W, H, fl = [];
  function rs(){ W = c.width = innerWidth; H = c.height = innerHeight; } rs(); addEventListener("resize", rs);
  for (let i = 0; i < 60; i++) fl.push({x:Math.random(), y:Math.random(), r:Math.random()*2+.6, s:Math.random()*.4+.2});
  (function loop(){ x.clearRect(0,0,W,H); x.fillStyle = "rgba(255,255,255,.75)";
    fl.forEach(f => { f.y += f.s/H*2; f.x += Math.sin(f.y*20)*.0004; if (f.y > 1) f.y = 0; x.beginPath(); x.arc(f.x*W, f.y*H, f.r, 0, 7); x.fill(); });
    requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>
