<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>ノーリーからのおくりもの | PULSE</title>
<!--
  ノーリー ポストカード特典ムービー（1123配布ポストカードのQRの行き先）
  公開先：GitHub Pages（wff-pulse/nolly/postcard-aichi-autumn-01/）
  再生終了またはスキップで、限定キープセイクのページ（NEXT_URL）へ移動します。
-->
<style>
  html,body{margin:0;height:100%;height:100dvh;background:#050407;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;transition:background-color .6s ease;-webkit-tap-highlight-color:transparent}
  video{height:100%;width:100%;max-width:calc(100dvh*9/16);object-fit:cover;display:block;transition:opacity .6s ease}
  body.is-white{background:#f7f2e8}
  body.is-white video,body.is-white button{opacity:0;pointer-events:none}
  button{position:absolute;font:500 13px/1 "Hiragino Sans","Noto Sans JP",sans-serif;color:#fff;background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:10px 16px;cursor:pointer;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .3s}
  button:focus-visible{outline:2px solid #6fe3cf;outline-offset:2px}
  .skip{top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px))}
  .sound{bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%)}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay preload="auto" poster="nolly-card-poster.jpg" src="nolly-card.mp4" aria-label="ノーリーの特典ムービー"></video>
<button type="button" class="skip" id="skip">スキップ ›</button>
<button type="button" class="sound" id="sound">♪ 音を出す</button>
<script>
(function(){
  var NEXT_URL = 'https://pulseculture.ai/limited-keepsake/aichi-autumn-01/?lang=ja&assigned=1';   // ムービー後に開くページ
  var v=document.getElementById('v'), skip=document.getElementById('skip'), sound=document.getElementById('sound'), done=false;
  function finish(){
    if(done) return; done=true;
    document.body.classList.add('is-white');
    try{v.pause();}catch(e){}
    setTimeout(function(){ location.replace(NEXT_URL); }, 650); // 戻るボタンでムービーに戻らないよう replace
  }
  v.addEventListener('ended',finish);
  v.addEventListener('error',finish);
  skip.addEventListener('click',finish);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') finish(); });
  sound.addEventListener('click',function(){
    v.muted=!v.muted; sound.textContent=v.muted?'♪ 音を出す':'♪ 音を消す';
    if(v.paused) v.play().catch(function(){});
  });
  var p=v.play();
  if(p&&p.catch) p.catch(function(){
    sound.textContent='▶ タップして再生';
    document.body.addEventListener('click',function once(ev){
      if(ev.target===skip) return;
      document.body.removeEventListener('click',once);
      sound.textContent='♪ 音を出す'; v.play().catch(finish);
    });
  });
  setTimeout(finish,40000); // 万一止まったままでもサイトへ
})();
</script>
</body>
</html>
